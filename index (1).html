<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>DATE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap');

  :root{
    --bg: #FAFAFA;
    --card: #FFFFFF;
    --green: #1A1A1A;
    --green-deep: #000000;
    --green-tint: #EBEBEB;
    --green-soft: #F5F5F5;
    --blue: #7D7D7D;
    --blue-deep: #4C4C4C;
    --blue-tint: #E3E3E3;
    --blue-soft: #F0F0F0;
    --ink: #171717;
    --ink-soft: #6E6E6E;
    --line: #E2E2E2;
    --danger: #171717;
    --amber: #171717;
    --shadow: 0 10px 28px rgba(23,23,23,0.12);
    --shadow-sm: 0 3px 10px rgba(23,23,23,0.08);
    --grad: linear-gradient(135deg, var(--green) 0%, var(--blue) 100%);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; min-width:0;}
  html,body{margin:0;padding:0; width:100%; overflow-x:hidden;}
  body{
    background: var(--bg);
    min-height:100vh;
    min-height:100dvh;
    font-family: 'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
  }
  .shell{
    width:100%;
    max-width:460px;
    min-height:100vh;
    min-height:100dvh;
    background: var(--bg);
    position:relative;
    box-shadow: 0 0 50px rgba(23,23,23,0.10);
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  img{ max-width:100%; }
  ::selection{ background: var(--green-tint); }
  h1,h2,h3{ font-family:'Gowun Batang', 'Nanum Myeongjo', serif; margin:0; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; touch-action:manipulation; }
  input, textarea, select{ font-family:inherit; }
  .hide{ display:none !important; }

  .ic{ display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ic svg{ width:100%; height:100%; display:block; }
  .ic-14{ width:14px; height:14px; }
  .ic-16{ width:16px; height:16px; }
  .ic-18{ width:18px; height:18px; }
  .ic-20{ width:20px; height:20px; }
  .ic-22{ width:22px; height:22px; }
  .ic-28{ width:28px; height:28px; }
  .ic-40{ width:40px; height:40px; }

  /* ---------- Login ---------- */
  #loginScreen, #identityScreen, #ddaySetupScreen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 32px 28px; text-align:center; background: var(--grad); color:#fff; min-height:100vh;
  }
  .login-logo{ color:#fff; margin-bottom:10px; }
  #loginScreen h1, #identityScreen h1{ font-size:27px; color:#fff; margin-bottom:4px; letter-spacing:0.5px;}
  .login-sub{ color:rgba(255,255,255,0.92); font-size:13.5px; margin-bottom:30px; line-height:1.6;}
  .pin-dots{ display:flex; gap:14px; margin-bottom:26px; }
  .pin-dot{ width:16px; height:16px; border-radius:50%; border:1.5px solid #fff; background:transparent; transition: background 0.15s, transform 0.15s; }
  .pin-dot.filled{ background: #fff; transform:scale(1.08); }
  .pin-dot.shake{ animation: shake 0.35s; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .keypad{ display:grid; grid-template-columns:repeat(3, clamp(52px,17vw,64px)); gap: clamp(8px,3vw,14px); justify-content:center; }
  .key{ width:100%; aspect-ratio:1/1; border-radius:50%; background: rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.4); font-size:20px; color:#fff; display:flex; align-items:center; justify-content:center; transition: background 0.12s, transform 0.1s; }
  .key:active{ transform:scale(0.94); background: rgba(255,255,255,0.32); }
  .key.ghost{ background:transparent; box-shadow:none; border:none; color:rgba(255,255,255,0.85); font-size:14px; }
  .login-msg{ min-height:20px; font-size:12.5px; color: #FFE1DC; margin-top:14px; font-weight:700; }
  .login-hint{ font-size:12px; color: rgba(255,255,255,0.85); margin-top:6px; }
  #ddaySetupScreen input[type=text], #ddaySetupScreen input[type=date]{
    width:100%; max-width:280px; padding:12px 14px; border-radius:12px; border:none; margin-bottom:12px; font-size:14px; background:#fff; color:var(--ink);
  }
  .onboard-btn{
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%; max-width:280px;
    padding:13px 0; border-radius:14px; background:#fff; color:var(--ink); font-weight:800; font-size:14px; box-shadow: var(--shadow-sm);
  }
  .identity-choices{ display:flex; gap:16px; margin-top:8px; width:100%; max-width:320px; }
  .identity-card{ flex:1; min-width:0; padding:22px 10px; border-radius:20px; background: rgba(255,255,255,0.14); border:1.5px solid rgba(255,255,255,0.5); color:#fff; font-weight:800; font-size:16px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .identity-card:active{ transform:scale(0.96); background: rgba(255,255,255,0.28); }
  .avatar-circle{ width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; color:#fff; flex-shrink:0; background: rgba(255,255,255,0.28); border:1.5px solid #fff; }
  .avatar-chip{ width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800; color:#fff; }
  .avatar-chip.a-엉지{ background: var(--green); }
  .avatar-chip.a-세비{ background: var(--blue); }

  header.app-header{ padding: 16px 20px 14px; display:flex; flex-direction:column; gap:10px; background: var(--grad); position:sticky; top:0; z-index:5; border-radius: 0 0 22px 22px; box-shadow: var(--shadow-sm); }
  header.app-header .header-top{ display:flex; align-items:center; justify-content:space-between; }
  header.app-header .title-wrap{ display:flex; align-items:center; gap:9px; }
  header.app-header h1{ font-size:19px; color:#fff; letter-spacing:0.3px; }
  header.app-header .user-pill{ font-size:11px; background: rgba(255,255,255,0.22); color:#fff; padding:4px 10px 4px 4px; border-radius:12px; font-weight:700; display:flex; align-items:center; gap:5px; }
  header.app-header .header-actions{ display:flex; gap:8px; align-items:center; }
  header.app-header .icon-btn{ color:#fff; padding:6px; opacity:0.95; }
  .dday-pin{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    background: rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.3); border-radius:12px;
    padding:8px 12px; color:#fff; font-size:12px; font-weight:700;
  }
  .dday-pin .ic{ color:#fff; }
  .dday-pin .dp-num{ font-family:'Gowun Batang',serif; font-size:14px; }
  .dday-pin .dp-label{ opacity:0.9; font-weight:600; }
  .map-save-bar{ padding: 10px 14px; background: var(--card); border-top:1px solid var(--line); }
  .map-save-bar .save-btn{ margin:0; box-shadow:none; }
  main{ flex:1; padding: 20px 18px 96px; overflow-y:auto; }

  nav.bottom-nav{ position:sticky; bottom:0; left:0; right:0; display:flex; background: var(--card); border-top:1px solid var(--line); padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); z-index:6; }
  nav.bottom-nav button{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 1px; border-radius:12px; color: var(--ink-soft); font-size:10.5px; }
  nav.bottom-nav button.active{ color: var(--green-deep); }

  .section-title{ font-size:15.5px; font-weight:800; color:var(--green-deep); margin: 4px 0 12px; display:flex; align-items:center; gap:8px; padding-left:10px; border-left:4px solid var(--green); }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px; margin-bottom:16px; box-shadow: var(--shadow-sm); }
  .divider-wave{ text-align:center; color:var(--blue); opacity:0.55; letter-spacing:8px; font-size:12px; margin: 22px 0; font-weight:700; }
  .back-row{ display:flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:13px; font-weight:700; margin-bottom:14px; }

  .hub-row{ display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
  .hub-row .hub-ico{ width:44px; height:44px; border-radius:13px; background: var(--green-soft); color:var(--green-deep); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .hub-row .hub-text{ flex:1; }
  .hub-row .hub-title{ font-size:14.5px; font-weight:800; color:var(--ink); }
  .hub-row .hub-desc{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .hub-row .hub-chev{ color: var(--ink-soft); font-size:16px; }

  .wheel-wrap{ position:relative; width:250px; max-width:100%; aspect-ratio:1/1; margin: 6px auto 18px; }
  .wheel-pointer{ position:absolute; top:-8px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:11px solid transparent; border-right:11px solid transparent; border-top:22px solid var(--blue-deep); z-index:3; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.2)); }
  .wheel-disc{ width:100%; height:100%; border-radius:50%; position:relative; border: 6px solid var(--card); box-shadow: 0 6px 24px rgba(23,23,23,0.22), inset 0 0 0 1px var(--line); transition: transform 4.2s cubic-bezier(0.12,0.72,0.15,1); }
  .wheel-svg{ position:absolute; inset:0; width:100%; height:100%; }
  .wheel-label{ position:absolute; left:50%; top:50%; width:1px; height:1px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--ink); white-space:nowrap; }
  .wheel-center{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:48px; height:48px; border-radius:50%; background:var(--grad); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow-sm); z-index:2; border: 2px solid #fff; }
  .spin-btn{ display:flex; align-items:center; justify-content:center; gap:6px; margin: 4px auto 0; padding: 13px 36px; border-radius:26px; background: var(--grad); color:#fff; font-weight:800; font-size:14.5px; box-shadow: var(--shadow-sm); }
  .spin-btn:disabled{ opacity:0.5; }
  .option-chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chip{ background: var(--blue-tint); color: var(--blue-deep); padding:6px 12px; border-radius:16px; font-size:12.5px; display:flex; align-items:center; gap:6px; font-weight:600; }
  .chip button{ color:var(--blue-deep); font-size:13px; line-height:1; }
  .add-row{ display:flex; gap:8px; margin-bottom:6px; }
  .add-row input{ flex:1; padding:11px 12px; border:1.5px solid var(--line); border-radius:12px; font-size:13.5px; background: var(--bg); }
  .add-row button{ padding:11px 16px; border-radius:12px; background: var(--blue); color:#fff; font-size:13px; font-weight:800; white-space:nowrap; }
  .quickfill{ font-size:12px; color:var(--blue-deep); text-decoration:underline; margin-top:2px; display:inline-block; font-weight:700; }

  .theme-tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .theme-tab{ flex:1; padding:11px 0; border-radius:14px; border:1.5px solid var(--line); background: var(--bg); font-size:13.5px; font-weight:700; color: var(--ink-soft); }
  .theme-tab.active{ background: var(--grad); color:#fff; border-color:transparent; }
  .draw-card{ height: 175px; border-radius:20px; position:relative; margin-bottom:16px; background: var(--grad); display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow: var(--shadow); }
  .draw-card .paper{ position:absolute; inset:0; width:100%; height:100%; background: var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .paper .paper-label{ font-size:11.5px; color:var(--ink-soft); margin-bottom:8px; letter-spacing:1px; font-weight:700; }
  .paper .paper-result{ font-size:21px; font-weight:800; color:var(--green-deep); font-family:'Gowun Batang',serif; padding:0 16px; }
  .scratch-canvas{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:pointer; }
  .draw-btn{ display:flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:13px 0; border-radius:14px; background: var(--grad); color:#fff; font-weight:800; font-size:14px; box-shadow: var(--shadow-sm); }

  .mood-row{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .mood-btn{ width:42px; height:42px; border-radius:50%; background: var(--bg); border:1.5px solid var(--line); font-size:19px; display:flex; align-items:center; justify-content:center; }
  .mood-btn.active{ border-color:var(--green); background: var(--green-tint); transform:scale(1.08); }
  .field-label{ font-size:12px; color:var(--ink-soft); margin: 2px 0 6px; font-weight:700; }
  .field-input{ width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:12px; font-size:13.5px; background: var(--bg); margin-bottom:14px; }
  textarea.field-input{ min-height:100px; resize:vertical; line-height:1.6; }
  .photo-zone{ border:1.5px dashed var(--line); border-radius:14px; padding:14px; text-align:center; margin-bottom:14px; position:relative; background: var(--bg); }
  .photo-preview{ max-width:100%; max-height:180px; border-radius:10px; display:block; margin:0 auto; }
  .photo-zone label{ display:flex; align-items:center; justify-content:center; gap:7px; color: var(--blue-deep); font-size:13px; font-weight:700; padding:14px 0; }
  .upload-spinner{ display:flex; align-items:center; justify-content:center; gap:7px; color: var(--ink-soft); font-size:13px; font-weight:700; padding:14px 0; }
  .photo-remove{ position:absolute; top:8px; right:8px; background:rgba(23,23,23,0.6); color:#fff; border-radius:50%; width:24px; height:24px; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .save-btn{ width:100%; padding:14px 0; border-radius:14px; background: var(--grad); color:#fff; font-weight:800; font-size:14.5px; box-shadow: var(--shadow-sm); margin-top:2px; }
  .save-btn:disabled{ opacity:0.6; }
  .cancel-edit{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:10px; text-decoration:underline; }

  .filter-row{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .filter-chip{ padding:7px 14px; border-radius:14px; font-size:12.5px; font-weight:700; border:1.5px solid var(--line); color:var(--ink-soft); background:var(--card); display:flex; align-items:center; gap:5px; }
  .filter-chip.active{ background: var(--ink); color:#fff; border-color:var(--ink); }

  .diary-entry{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:12px; }
  .diary-entry .de-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px; }
  .diary-entry .de-date{ font-size:13px; font-weight:800; color: var(--ink); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .author-tag{ font-size:10.5px; padding:3px 8px; border-radius:8px; font-weight:800; color:#fff; }
  .author-tag.author-엉지{ background: var(--green); }
  .author-tag.author-세비{ background: var(--blue); }
  .type-tag{ font-size:10.5px; padding:3px 8px; border-radius:8px; font-weight:800; background: var(--blue-soft); color:var(--blue-deep); }
  .diary-entry .de-actions{ display:flex; gap:10px; font-size:12px; color: var(--ink-soft); flex-shrink:0; }
  .diary-entry img{ width:100%; max-height:220px; object-fit:cover; border-radius:10px; margin-bottom:8px; loading:lazy; }
  .diary-entry .de-text{ font-size:13.5px; line-height:1.65; color: var(--ink); white-space:pre-wrap; }
  .empty-note{ text-align:center; color:var(--ink-soft); font-size:13px; padding: 30px 10px; line-height:1.7; }
  .star-row{ display:flex; gap:4px; margin-bottom:14px; }
  .star-btn{ color:var(--line); }
  .star-btn.filled{ color: var(--amber); }
  .star-display{ display:inline-flex; gap:2px; vertical-align:-3px; }
  .star-display .ic{ color:var(--line); }
  .star-display .ic.filled{ color:var(--amber); }
  .type-chip-row{ display:flex; gap:8px; margin-bottom:14px; }
  .type-chip{ flex:1; padding:10px 0; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); font-size:13px; font-weight:700; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; gap:5px; }
  .type-chip.active{ background: var(--grad); color:#fff; border-color:transparent; }

  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cal-header button{ font-size:17px; color:var(--green-deep); padding:6px 12px; font-weight:800; }
  .cal-header .cal-title{ font-size:16px; font-weight:800; color:var(--ink); font-family:'Gowun Batang',serif; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .cal-dow{ font-size:11px; color:var(--ink-soft); padding-bottom:6px; font-weight:700; }
  .cal-cell{ aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:12px; font-size:12.5px; color:var(--ink); position:relative; background:transparent; gap:2px; }
  .cal-cell.other-month{ color:#D8DED9; }
  .cal-cell.today{ border:1.5px solid var(--blue); font-weight:800; }
  .cal-cell.has-date{ background: var(--green-tint); font-weight:700; }
  .cal-cell .dotrow{ display:flex; gap:2px; align-items:center; }
  .cal-cell .dot{ width:5px; height:5px; border-radius:50%; }
  .cal-cell .dot.dot-엉지{ background: var(--green); }
  .cal-cell .dot.dot-세비{ background: var(--blue); }
  .cal-cell .mark-diamond{ width:6px; height:6px; background: var(--blue-deep); transform:rotate(45deg); border-radius:1px; }
  .cal-dday-banner{ background: var(--grad); color:#fff; border-radius:16px; padding:16px 16px; margin-bottom:16px; text-align:center; }
  .cal-dday-banner .num{ font-size:23px; font-weight:800; font-family:'Gowun Batang',serif; }
  .cal-dday-banner .lbl{ font-size:12px; opacity:0.92; margin-top:2px; }
  .cal-legend{ display:flex; gap:14px; justify-content:center; margin-top:14px; font-size:11px; color:var(--ink-soft); flex-wrap:wrap; }
  .cal-legend span{ display:flex; align-items:center; gap:5px; }
  .cal-legend .dot{ width:8px; height:8px; border-radius:50%; }
  .cal-legend .mark-diamond{ width:7px; height:7px; background: var(--blue-deep); transform:rotate(45deg); border-radius:1px; }

  .dday-hero{ background: var(--grad); border-radius:20px; padding:26px 20px; text-align:center; color:#fff; margin-bottom:18px; box-shadow: var(--shadow); }
  .dday-hero .h-label{ font-size:12.5px; opacity:0.92; margin-bottom:6px; font-weight:600; }
  .dday-hero .h-num{ font-size:38px; font-weight:800; font-family:'Gowun Batang',serif; }
  .dday-hero .h-date{ font-size:11.5px; opacity:0.88; margin-top:8px; }
  .dday-item{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; }
  .dday-item .dl{ font-size:13.5px; font-weight:700; }
  .dday-item .dd{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .dday-item .dnum{ font-size:16px; font-weight:800; color: var(--blue-deep); font-family:'Gowun Batang',serif; }
  .dday-item .drow-actions{ display:flex; gap:8px; }
  .dday-item .drow-actions button{ font-size:12px; color: var(--ink-soft); }

  .map-summary{ text-align:center; margin-bottom:14px; }
  .map-summary .msum-num{ font-size:30px; font-weight:800; color:var(--green-deep); font-family:'Gowun Batang',serif; }
  .map-summary .msum-lbl{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .map-svg-wrap{ width:100%; display:flex; justify-content:center; margin-bottom:14px; }
  .map-svg-wrap svg{ width:100%; max-width:320px; height:auto; }
  .kr-region{ fill: var(--green-soft); stroke:#fff; stroke-width:6; cursor:pointer; transition: fill 0.15s; }
  .kr-region.tier-partial{ fill: var(--green-tint); }
  .kr-region.tier-full{ fill: url(#regionGrad); }
  .kr-muni{ fill: var(--green-soft); stroke:#fff; stroke-width:2; cursor:pointer; transition: fill 0.12s; }
  .kr-muni.visited{ fill: url(#regionGrad); }
  .kr-region:active, .kr-muni:active{ opacity:0.82; }
  .region-chip-grid{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; }
  .region-chip{ padding:7px 11px; border-radius:12px; font-size:12px; font-weight:700; background: var(--bg); border:1.5px solid var(--line); color:var(--ink-soft); }
  .region-chip.tier-partial{ background: var(--green-tint); color:var(--green-deep); border-color:transparent; }
  .region-chip.tier-full{ background: var(--grad); color:#fff; border-color:transparent; }
  .region-chip.visited{ background: var(--grad); color:#fff; border-color:transparent; }
  .map-note{ text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:12px; line-height:1.6; }

/* =====================================================================
   storage helpers
   - shared=true  -> Firestore collection "appData" (both phones see the same data)
   - shared=false -> browser localStorage (only remembers "who am I" on this device)
   Every other part of the app calls sGet/sSet/sDelete/sList/sGetMany exactly
   like before - only this section talks to Firebase.
   ===================================================================== */
async function sGet(key, shared, fallback){
  if(!shared){
    try{
      const raw = localStorage.getItem('local:'+key);
      return raw!==null ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  for(let attempt=0; attempt<2; attempt++){
    try{
      const doc = await db.collection('appData').doc(key).get();
      return doc.exists ? doc.data().value : fallback;
    }catch(e){
      if(attempt===0){ await new Promise(r=>setTimeout(r,250)); continue; }
      return fallback;
    }
  }
  return fallback;
}
async function sSet(key, value, shared){
  if(!shared){
    try{ localStorage.setItem('local:'+key, JSON.stringify(value)); return true; }
    catch(e){ return false; }
  }
  for(let attempt=0; attempt<2; attempt++){
    try{ await db.collection('appData').doc(key).set({ value: value, updatedAt: Date.now() }); return true; }
    catch(e){
      if(attempt===0){ await new Promise(r=>setTimeout(r,400)); continue; }
      return false;
    }
  }
  return false;
}
async function sDelete(key, shared){
  if(!shared){
    try{ localStorage.removeItem('local:'+key); return true; }
    catch(e){ return false; }
  }
  for(let attempt=0; attempt<2; attempt++){
    try{ await db.collection('appData').doc(key).delete(); return true; }
    catch(e){
      if(attempt===0){ await new Promise(r=>setTimeout(r,400)); continue; }
      return false;
    }
  }
  return false;
}
async function sList(prefix, shared){
  if(!shared){
    const out = [];
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('local:'+prefix)===0) out.push(k.slice(6));
      }
    }catch(e){}
    return out;
  }
  for(let attempt=0; attempt<2; attempt++){
    try{
      const end = prefix + '\uf8ff';
      const snap = await db.collection('appData')
        .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
        .where(firebase.firestore.FieldPath.documentId(), '<', end)
        .get();
      return snap.docs.map(d=>d.id);
    }catch(e){
      if(attempt===0){ await new Promise(r=>setTimeout(r,250)); continue; }
      return [];
    }
  }
  return [];
}
// Fetches many keys without overwhelming the storage backend at once (avoids rate limiting).
async function sGetMany(keys, shared, concurrency){
  concurrency = concurrency || 6;
  const results = new Array(keys.length);
  let idx = 0;
  async function worker(){
    while(idx < keys.length){
      const cur = idx++;
      results[cur] = await sGet(keys[cur], shared, null);
    }
  }
  const workers = [];
  for(let i=0;i<Math.min(concurrency, keys.length);i++) workers.push(worker());
  await Promise.all(workers);
  return results;
}

/* ===================== photo handling (stored directly in Firestore) ===================== */
// Firebase Storage needs the paid Blaze plan, so instead we compress the photo down
// small enough (roughly under half a megabyte) to store right inside the Firestore
// document as a JPEG data URL. Firestore documents can hold up to 1MB, so one
// reasonably-sized photo per entry fits comfortably.
// createImageBitmap decodes natively (often off the main thread) which is a lot
// faster than the old <img> + canvas approach, especially for large phone-camera
// photos (several MB, 4000px+). Falls back to the classic method if unsupported.
async function compressImage(file, cb, onError){
  const maxDim = 800;
  function drawAndEmit(sourceW, sourceH, drawFn){
    let w = sourceW, h = sourceH;
    if(w>h && w>maxDim){ h = h*(maxDim/w); w = maxDim; }
    else if(h>=w && h>maxDim){ w = w*(maxDim/h); h = maxDim; }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    drawFn(canvas.getContext('2d'), w, h);
    cb(canvas.toDataURL('image/jpeg', 0.62));
  }
  if(window.createImageBitmap){
    try{
      const bitmap = await createImageBitmap(file);
      drawAndEmit(bitmap.width, bitmap.height, (ctx,w,h)=>{ ctx.drawImage(bitmap,0,0,w,h); bitmap.close && bitmap.close(); });
      return;
    }catch(e){ /* fall through to legacy path below */ }
  }
  const reader = new FileReader();
  reader.onerror = function(){ onError && onError(new Error('파일을 읽지 못했어요')); };
  reader.onload = function(ev){
    const img = new Image();
    img.onerror = function(){ onError && onError(new Error('이미지를 열지 못했어요')); };
    img.onload = function(){ drawAndEmit(img.width, img.height, (ctx,w,h)=>ctx.drawImage(img,0,0,w,h)); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDateKor(dateStr){
  const [y,m,d] = dateStr.split('-');
  return y+'.'+m+'.'+d;
}
function dayDiff(targetDate){
  const t = new Date(targetDate+'T00:00:00');
  const now = new Date(todayStr()+'T00:00:00');
  return Math.round((now - t)/86400000);
}
function ddayLabel(diff){
  if(diff===0) return 'D-DAY';
  return diff>0 ? ('D+'+diff) : ('D'+diff);
}

function mountTab(){
  document.getElementById('bottomNav').querySelectorAll('button').forEach(b=>{
    const isMoreGroup = ['dday','map','culture','season','more'].includes(state.tab);
    const active = (b.dataset.tab===state.tab) || (b.dataset.tab==='more' && isMoreGroup);
    b.classList.toggle('active', active);
  });
  refreshHeader();
  const main = document.getElementById('mainContent');
  if(state.tab==='home'){
    main.innerHTML = '<div id="wheelSection"></div><div class="divider-wave">· · ·</div><div id="drawSection"></div>';
    fillWheelSection();
    fillDrawSection(true);

    main.innerHTML = '<div id="diaryFormSection"></div>'+
      '<div class="section-title">'+I('note')+'지난 기록들</div>'+
      '<div class="filter-row" id="diaryFilterRow">'+

        '<button class="filter-chip '+(state.diaryFilter==='엉지'?'active':'')+'" data-filter="엉지"><span class="avatar-chip a-엉지">엉</span>엉지</button>'+
        '<button class="filter-chip '+(state.diaryFilter==='세비'?'active':'')+'" data-filter="세비"><span class="avatar-chip a-세비">세</span>세비</button>'+
      '</div>'+
      '<div id="diaryListSection"></div>';
    fillDiaryForm();
    fillDiaryList();
    attachDiaryFilterHandlers();
  } else if(state.tab==='calendar'){
    main.innerHTML = renderCalendar();
    attachCalendarHandlers();
  } else if(state.tab==='more'){
    main.innerHTML = renderHub();
    attachHubHandlers();
  } else if(state.tab==='dday'){
    main.innerHTML = renderDday();
    attachDdayHandlers();
  } else if(state.tab==='map'){

async function initAuth(){
  const savedPin = await sGet('auth-password', true, null);
  if(!savedPin){
    state.pinMode = 'setup1';
    renderLogin('처음 오셨네요! 둘이 같이 쓸 4자리 비밀번호를 정해주세요.');
  } else {
    state.pinMode = 'login';
    renderLogin('비밀번호 4자리를 입력해주세요.');
  }
}

function renderLogin(subMsg, errMsg){
  const dotsHtml = [0,1,2,3].map(i=>{
    const filled = i < state.pinBuffer.length;
    return '<div class="pin-dot'+(filled?' filled':'')+'" data-i="'+i+'"></div>';
  }).join('');
  const keys = ['1','2','3','4','5','6','7','8','9','','0','del'];
  const keysHtml = keys.map(k=>{
    if(k==='') return '<div></div>';
    if(k==='del') return '<button class="key ghost" data-key="del">지우기</button>';
    return '<button class="key" data-key="'+k+'">'+k+'</button>';
  }).join('');

  document.getElementById('loginScreen').innerHTML =
    '<div class="login-logo">'+I('logo','ic-40')+'</div>'+
    '<h1>엉지와 세비의 데이트</h1>'+
    '<div class="login-sub">'+subMsg+'</div>'+
    '<div class="pin-dots" id="pinDots">'+dotsHtml+'</div>'+
    '<div class="keypad">'+keysHtml+'</div>'+
    '<div class="login-msg">'+(errMsg||'')+'</div>'+
    (state.pinMode==='login' ? '<div class="login-hint">비밀번호를 잊었다면 둘이 상의해서 다시 정해요 :)</div>' : '');

  document.querySelectorAll('.key[data-key]').forEach(btn=>{
    btn.addEventListener('click', ()=>onKeyPress(btn.dataset.key));
  });
}

function onKeyPress(k){
  if(k==='del'){ state.pinBuffer = state.pinBuffer.slice(0,-1); updatePinDots(); return; }
  if(state.pinBuffer.length>=4) return;
  state.pinBuffer += k;
  updatePinDots();
  if(state.pinBuffer.length===4){ setTimeout(handlePinComplete, 150); }
}
function updatePinDots(){
  document.querySelectorAll('#pinDots .pin-dot').forEach((d,i)=>{ d.classList.toggle('filled', i < state.pinBuffer.length); });
}

async function handlePinComplete(){
  const pin = state.pinBuffer;
  if(state.pinMode==='setup1'){
    state.pinTemp = pin; state.pinBuffer='';
    renderLogin('비밀번호를 한 번 더 입력해서 확인해주세요.');
    state.pinMode='setup2';
  } else if(state.pinMode==='setup2'){
    if(pin===state.pinTemp){ await sSet('auth-password', pin, true); afterUnlock(); }
    else {
      state.pinBuffer=''; state.pinTemp=''; state.pinMode='setup1';
      renderLogin('앗, 비밀번호가 서로 달라요. 처음부터 다시 정해주세요.', '비밀번호가 일치하지 않아요');
      shakeDots();
    }
  } else if(state.pinMode==='login'){
    const savedPin = await sGet('auth-password', true, null);
    if(pin===savedPin){ afterUnlock(); }
    else {
      state.pinBuffer='';
      renderLogin('비밀번호 4자리를 입력해주세요.', '비밀번호가 틀렸어요, 다시 시도해주세요');
      shakeDots();
    }
  }
}
function shakeDots(){
  const dots = document.getElementById('pinDots');
  if(dots){ dots.classList.add('shake'); setTimeout(()=>dots.classList.remove('shake'),350); }
}

function fillWheelSection(){

        '</div>'+
      '</div>'+
      '<button class="spin-btn" id="spinBtn" '+(state.rouletteOptions.length<2?'disabled':'')+'>'+
        (state.rouletteOptions.length<2 ? '2개 이상 넣어주세요' : '돌리기')+
      '</button>'+

        )).join('')+

        '<input type="text" id="newOptionInput" placeholder="예: 파스타 집, 한강 산책" maxlength="20">'+
        '<button id="addOptionBtn">추가</button>'+
      '</div>'+
      '<button class="quickfill" id="quickfillBtn">기본 후보 채우기</button>'+
    '</div>';
  document.getElementById('wheelSection').innerHTML = html;

  document.getElementById('spinBtn').addEventListener('click', spinWheel);
  document.querySelectorAll('[data-remove]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const idx = parseInt(b.dataset.remove,10);
      const removed = state.rouletteOptions.splice(idx,1);
      fillWheelSection();
      sSet('roulette-options', state.rouletteOptions, true).then(ok=>{
        if(!ok){ state.rouletteOptions.splice(idx,0,removed[0]); fillWheelSection(); showToast('저장에 실패했어요'); }
      });
    });
  });
  const addBtn = document.getElementById('addOptionBtn');
  const newInput = document.getElementById('newOptionInput');
  addBtn.addEventListener('click', ()=>{
    const v = newInput.value.trim();
    if(!v) return;
    if(state.rouletteOptions.length>=12){ showToast('최대 12개까지 담을 수 있어요'); return; }
    state.rouletteOptions.push(v);
    fillWheelSection();
    sSet('roulette-options', state.rouletteOptions, true);
  });
  newInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') addBtn.click(); });
  document.getElementById('quickfillBtn').addEventListener('click', ()=>{
    state.rouletteOptions = Array.from(new Set([...state.rouletteOptions, ...ROULETTE_STARTER])).slice(0,12);
    fillWheelSection();
    sSet('roulette-options', state.rouletteOptions, true);
  });
}

function wheelBackgroundHtml(){
  const n = state.rouletteOptions.length;
  if(n===0) return '<div style="position:absolute;inset:0;border-radius:50%;background:var(--bg);"></div>';
  const palette = ['#ECECEC','#DADADA','#FFFFFF'];
  const slice = 360/n;
  let gradParts = [];
  for(let i=0;i<n;i++){ gradParts.push(palette[i%palette.length]+' '+(i*slice)+'deg '+((i+1)*slice)+'deg'); }
  const bg = 'conic-gradient(from 0deg, '+gradParts.join(', ')+')';
  let lines = '';
  const R = 125;
  for(let i=0;i<n;i++){
    const ang = (i*slice) * Math.PI/180;
    const x = 125 + R*Math.sin(ang), y = 125 - R*Math.cos(ang);
    lines += '<line x1="125" y1="125" x2="'+x+'" y2="'+y+'" stroke="#E2E2E2" stroke-width="1.5" />';
  }
  const svg = '<svg class="wheel-svg" viewBox="0 0 250 250">'+lines+'<circle cx="125" cy="125" r="122" fill="none" stroke="#E2E2E2" stroke-width="2"/></svg>';
  let labels = '';
  for(let i=0;i<n;i++){
    const mid = i*slice + slice/2, radius = 88;
    const text = state.rouletteOptions[i];
    const short = text.length>7 ? text.slice(0,6)+'…' : text;
    labels += '<div class="wheel-label" style="transform: translate(-50%,-50%) rotate('+mid+'deg) translate(0,-'+radius+'px) rotate(-'+mid+'deg);">'+escapeHtml(short)+'</div>';
  }
  return '<div style="position:absolute;inset:0;border-radius:50%;background:'+bg+';"></div>'+svg+labels;
}

function spinWheel(){
  const n = state.rouletteOptions.length;
  if(n<2 || state.spinning) return;
  state.spinning = true;
  const winnerIndex = Math.floor(Math.random()*n);
  const slice = 360/n;
  const targetAngleInWheel = winnerIndex*slice + slice/2;
  const currentMod = ((state.wheelRotation % 360)+360)%360;
  let delta = (360 - targetAngleInWheel - currentMod) % 360;
  if(delta < 0) delta += 360;
  state.wheelRotation += 5*360 + delta;
  const disc = document.getElementById('wheelDisc');
  disc.style.transform = 'rotate('+state.wheelRotation+'deg)';
  document.getElementById('spinBtn').disabled = true;
  setTimeout(()=>{
    state.spinning = false;
    document.getElementById('spinBtn').disabled = false;
    openModal(
      '<h3>'+I('sparkle','ic-18')+'오늘의 선택</h3><p style="font-size:18px;color:var(--green-deep);font-weight:800;text-align:center;">'+
      escapeHtml(state.rouletteOptions[winnerIndex])+'</p>'+
      '<div class="modal-actions" style="justify-content:center;"><button class="btn-primary" id="wheelOk">좋아요!</button></div>'
    );
    document.getElementById('wheelOk').onclick = closeModal;
  }, 4300);
}

function prepareNewDraw(){
  const list = state.recTheme==='food' ? FOOD_LIST : DATE_LIST;
  let pick;
  do{ pick = list[Math.floor(Math.random()*list.length)]; } while(pick===state.recResult && list.length>1);
  state.recResult = pick;
  state.recRevealed = false;
  buildDrawMarkup();
  setupScratchCanvas();
}

function fillDrawSection(isInitial){
  if(isInitial && state.recResult===null){
    prepareNewDraw();
  } else {
    buildDrawMarkup();
    setupScratchCanvas();
  }
}

function setupScratchCanvas(){
  const canvas = document.getElementById('scratchCanvas');
  const wrap = document.getElementById('drawCardWrap');
  if(!canvas || !wrap) return;
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const cssW = rect.width || 280, cssH = rect.height || 175;
  canvas.width = Math.round(cssW*dpr);
  canvas.height = Math.round(cssH*dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);

  if(state.recRevealed){
    canvas.style.display='none';
    return;
  }
  canvas.style.display='block';
  canvas.style.opacity='1';
  canvas.style.pointerEvents='auto';

  const grad = ctx.createLinearGradient(0,0,cssW,cssH);
  grad.addColorStop(0, '#E6E6E6'); grad.addColorStop(1,'#D2D2D2');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,cssW,cssH);
  ctx.fillStyle = 'rgba(23,23,23,0.4)';
  ctx.font = '700 13px "Noto Sans KR", sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('손가락으로 긁어보세요', cssW/2, cssH/2 - 8);
  ctx.font = '400 11px "Noto Sans KR", sans-serif';
  ctx.fillText('오늘의 쪽지가 나타나요', cssW/2, cssH/2 + 14);

  let drawing = false, lastCheck = 0;
  function getPos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function scratchAt(x,y){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(x,y,24,0,Math.PI*2); ctx.fill();
  }
  function checkReveal(){
    if(state.recRevealed) return;
    let imgData;
    try{ imgData = ctx.getImageData(0,0,canvas.width,canvas.height).data; }catch(e){ return; }
    let transparent=0, total=0;
    for(let i=3;i<imgData.length;i+=4*9){ total++; if(imgData[i] < 40) transparent++; }
    const ratio = total? transparent/total : 0;
    if(ratio > 0.42){
      state.recRevealed = true;
      canvas.style.transition = 'opacity 0.35s';
      canvas.style.opacity = '0';
      canvas.style.pointerEvents = 'none';
      setTimeout(()=>{ if(canvas) canvas.style.display='none'; }, 350);
    }
  }
  function onDown(e){ drawing=true; try{ canvas.setPointerCapture(e.pointerId); }catch(err){} const p=getPos(e); scratchAt(p.x,p.y); e.preventDefault(); }
  function onMove(e){
    if(!drawing) return;
    const p=getPos(e); scratchAt(p.x,p.y);
    const now = performance.now();
    if(now-lastCheck>140){ lastCheck=now; checkReveal(); }
    e.preventDefault();
  }
  function onUp(){ if(!drawing) return; drawing=false; checkReveal(); }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
}

   DIARY (form + list rendered independently)
   ================================================================= */
async function loadDiaryEntries(){
  const keys = await sList('diary-entry:', true);
  const results = await sGetMany(keys, true);
  const entries = results.filter(Boolean);
  entries.sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));
  state.diaryEntries = entries;
}
function getEntriesForDate(dateStr){ return state.diaryEntries.filter(e=>e.date===dateStr); }
function resetDiaryDraft(dateOverride){
  state.diaryDraft = { id:null, date: dateOverride || todayStr(), mood:'😊', text:'', photo:null, author:null };
}

function fillDiaryForm(){
  const d = state.diaryDraft;
  const editingNotice = d.id ? '<div class="cancel-edit" id="cancelEditBtn">'+I('close','ic-14')+' 수정 취소하고 새로 쓰기</div>' : '';
  const photoZone = d.photoProcessing
    ? '<div class="photo-zone"><div class="upload-spinner">'+I('camera','ic-18')+'사진 처리 중...</div></div>'
    : d.photo
    ? '<div class="photo-zone"><img class="photo-preview" src="'+d.photo+'"><button class="photo-remove" id="removePhotoBtn">'+I('close','ic-14')+'</button></div>'
    : '<div class="photo-zone"><label for="photoInput">'+I('camera','ic-18')+'사진 추가하기</label><input type="file" accept="image/*" id="photoInput" style="display:none;"></div>';

  document.getElementById('diaryFormSection').innerHTML = ''+
    '<div class="card">'+
      editingNotice+
      '<div class="field-label">날짜</div>'+
      '<input type="date" class="field-input" id="diaryDateInput" value="'+d.date+'" max="'+todayStr()+'">'+
      '<div class="field-label">오늘 기분</div>'+
      '<div class="mood-row">'+MOODS.map(m=>'<button class="mood-btn '+(d.mood===m?'active':'')+'" data-mood="'+m+'">'+m+'</button>').join('')+'</div>'+
      '<div class="field-label">사진</div>'+photoZone+
      '<div class="field-label">이야기</div>'+
      '<textarea class="field-input" id="diaryTextInput" placeholder="오늘 데이트는 어땠나요?">'+escapeHtml(d.text)+'</textarea>'+
      '<button class="save-btn" id="saveDiaryBtn" '+(d.photoProcessing?'disabled':'')+'>'+(d.id?'수정 완료':'일기 저장 ('+(state.currentUser||'')+')')+'</button>'+
    '</div>';

  document.querySelectorAll('#diaryFormSection .mood-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ state.diaryDraft.mood = b.dataset.mood; fillDiaryForm(); });
  });
  document.getElementById('diaryDateInput').addEventListener('change', (e)=>{ state.diaryDraft.date = e.target.value; });
  document.getElementById('diaryTextInput').addEventListener('input', (e)=>{ state.diaryDraft.text = e.target.value; });
  const photoInput = document.getElementById('photoInput');
  if(photoInput) photoInput.addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    state.diaryDraft.photoProcessing = true;
    fillDiaryForm();
    compressImage(file, (dataUrl)=>{
      state.diaryDraft.photo = dataUrl;
      state.diaryDraft.photoProcessing = false;
      fillDiaryForm();
    }, (err)=>{
      state.diaryDraft.photoProcessing = false;
      fillDiaryForm();
      showToast('사진을 처리하지 못했어요. 다른 사진으로 시도해주세요');
    });
  });
  const removePhotoBtn = document.getElementById('removePhotoBtn');
  if(removePhotoBtn) removePhotoBtn.addEventListener('click', ()=>{ state.diaryDraft.photo = null; fillDiaryForm(); });
  const cancelEdit = document.getElementById('cancelEditBtn');
  if(cancelEdit) cancelEdit.addEventListener('click', ()=>{ resetDiaryDraft(); fillDiaryForm(); });

  document.getElementById('saveDiaryBtn').addEventListener('click', async function(){
    const d2 = state.diaryDraft;
    if(!d2.text.trim() && !d2.photo){ showToast('사진이나 글 중 하나는 남겨주세요'); return; }
    if(!d2.date){ showToast('날짜를 선택해주세요'); return; }
    this.disabled = true; this.textContent = '저장 중...';
    const id = d2.id || ('e'+Date.now());
    const author = d2.author || state.currentUser;
    const entry = { id, date: d2.date, mood: d2.mood, text: d2.text.trim(), photo: d2.photo, author, createdAt: Date.now() };
    const ok = await sSet('diary-entry:'+id, entry, true);
    if(!ok){ showToast('저장에 실패했어요. 사진 용량을 줄여보세요'); this.disabled=false; this.textContent = d2.id?'수정 완료':'일기 저장 ('+(state.currentUser||'')+')'; return; }
    resetDiaryDraft();
    await loadDiaryEntries();
    fillDiaryForm();
    fillDiaryList();
    showToast('일기를 저장했어요');
  });
}

function fillDiaryList(){
  const filtered = state.diaryFilter==='all' ? state.diaryEntries : state.diaryEntries.filter(e=>e.author===state.diaryFilter);
  const html = filtered.length===0
    ? '<div class="empty-note">아직 쓴 일기가 없어요.<br>오늘 데이트는 어땠나요? 위에서 첫 일기를 남겨보세요</div>'
    : filtered.map(e=>(
        '<div class="diary-entry">'+
          '<div class="de-top">'+
            '<div class="de-date">'+e.mood+' '+formatDateKor(e.date)+(e.author ? ' <span class="author-tag author-'+e.author+'">'+e.author+'</span>' : '')+'</div>'+
            '<div class="de-actions"><button data-edit="'+e.id+'">'+I('edit','ic-16')+'</button><button data-del="'+e.id+'">'+I('trash','ic-16')+'</button></div>'+
          '</div>'+
          (e.photo ? '<img src="'+e.photo+'" loading="lazy">' : '')+
          '<div class="de-text">'+escapeHtml(e.text)+'</div>'+
        '</div>'
      )).join('');
  document.getElementById('diaryListSection').innerHTML = html;

  document.querySelectorAll('#diaryListSection [data-edit]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const entry = state.diaryEntries.find(e=>e.id===b.dataset.edit);
      if(!entry) return;
      state.diaryDraft = { id: entry.id, date: entry.date, mood: entry.mood, text: entry.text, photo: entry.photo, author: entry.author };
      fillDiaryForm();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
  document.querySelectorAll('#diaryListSection [data-del]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.del;
      confirmModal('일기 삭제', '이 기록을 정말 삭제할까요? 되돌릴 수 없어요.', async ()=>{
        const backup = state.diaryEntries;
        state.diaryEntries = state.diaryEntries.filter(e=>e.id!==id);
        fillDiaryList();
        if(state.diaryDraft.id===id){ resetDiaryDraft(); fillDiaryForm(); }
        const ok = await sDelete('diary-entry:'+id, true);
        if(!ok){ state.diaryEntries = backup; fillDiaryList(); showToast('삭제에 실패했어요'); return; }
        showToast('삭제했어요');
      }, '삭제');
    });
  });
}

function attachDiaryFilterHandlers(){
  document.querySelectorAll('#diaryFilterRow .filter-chip').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.diaryFilter = b.dataset.filter;
      document.querySelectorAll('#diaryFilterRow .filter-chip').forEach(x=>x.classList.toggle('active', x===b));

   CALENDAR
   ================================================================= */
function renderCalendar(){
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const daysInPrevMonth = new Date(y,m,0).getDate();
  const today = todayStr();
  let cells = '';
  for(let i=0;i<startDow;i++){ cells += '<div class="cal-cell other-month">'+(daysInPrevMonth - startDow + i + 1)+'</div>'; }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const entries = getEntriesForDate(dateStr);
    const marked = state.dateMarks.includes(dateStr);
    const isDateDay = entries.length>0 || marked;
    const isToday = dateStr===today;
    const authors = Array.from(new Set(entries.map(e=>e.author).filter(Boolean)));
    let markHtml = '';
    if(authors.length>0) markHtml = '<div class="dotrow">'+authors.map(a=>'<div class="dot dot-'+a+'"></div>').join('')+'</div>';
    else if(marked) markHtml = '<div class="mark-diamond"></div>';
    cells += '<div class="cal-cell '+(isDateDay?'has-date':'')+' '+(isToday?'today':'')+'" data-date="'+dateStr+'">'+d+markHtml+'</div>';
  }
  const totalCells = startDow + daysInMonth;
  const remain = (7 - (totalCells % 7)) % 7;
  for(let i=1;i<=remain;i++){ cells += '<div class="cal-cell other-month">'+i+'</div>'; }
  let ddayBanner = '';
  if(state.ddayList.length>0){
    const primary = state.ddayList[0];
    ddayBanner = '<div class="cal-dday-banner"><div class="num">'+ddayLabel(dayDiff(primary.date))+'</div><div class="lbl">'+escapeHtml(primary.label)+'</div></div>';
  }
  return ''+
  '<div class="section-title">'+I('calendar')+'우리의 달력</div>'+
  ddayBanner+
  '<div class="card">'+
    '<div class="cal-header"><button id="prevMonthBtn">‹</button><div class="cal-title">'+y+'년 '+(m+1)+'월</div><button id="nextMonthBtn">›</button></div>'+
    '<div class="cal-grid">'+['일','월','화','수','목','금','토'].map(d=>'<div class="cal-dow">'+d+'</div>').join('')+cells+'</div>'+
    '<div class="cal-legend">'+
      '<span><div class="dot" style="background:var(--green);"></div>엉지 일기</span>'+
      '<span><div class="dot" style="background:var(--blue);"></div>세비 일기</span>'+
      '<span><div class="mark-diamond"></div>데이트 표시</span>'+
    '</div>'+
  '</div>';
}

async function toggleDateMark(dateStr){
  const idx = state.dateMarks.indexOf(dateStr);
  const wasMarked = idx>=0;
  if(wasMarked) state.dateMarks.splice(idx,1); else state.dateMarks.push(dateStr);
  const ok = await sSet('date-marks', state.dateMarks, true);
  if(!ok){
    if(wasMarked) state.dateMarks.push(dateStr); else state.dateMarks.splice(state.dateMarks.indexOf(dateStr),1);
    showToast('저장에 실패했어요. 다시 시도해주세요');
    return false;
  }
  return true;
}

/* =================================================================
   TRAVEL MAP (province -> municipality drill-down, optimistic taps)
   ================================================================= */
async function loadTravelMap(){
  const keys = await sList('travel-map:', true);
  const map = {};
  keys.forEach(k=>{ map[k.replace('travel-map:','')] = true; });
  state.travelMap = map;
}

function muniListFor(provinceKey){
  const p = MUNI_DATA[provinceKey];
  return p ? p.list : [];
}
function isMuniVisited(m){ return m.codes.every(c=>state.travelMap[c]); }
function muniKey(m){ return m.codes.join(','); }
function provinceTier(provinceKey){
  const list = muniListFor(provinceKey);
  if(list.length===0) return 'empty';
  const visited = list.filter(isMuniVisited).length;
  if(visited===0) return 'empty';
  if(visited===list.length) return 'full';
  return 'partial';
}
function provinceVisitedCount(provinceKey){
  return muniListFor(provinceKey).filter(isMuniVisited).length;
}

function mountMap(){
  document.getElementById('mainContent').innerHTML = state.mapProvince ? renderMapDrilldown(state.mapProvince) : renderMapOverview();
  attachMapHandlers();
  updateMapSaveBar();
}

function renderMapOverview(){
  const totalMuni = Object.values(MUNI_DATA).reduce((s,p)=>s+p.list.length,0);
  const visitedMuni = Object.keys(state.travelMap).length;
  const paths = REGION_DATA.map(r=>{
    const tier = provinceTier(r.key);
    return '<path class="kr-region tier-'+tier+'" data-region="'+r.key+'" d="'+r.d+'"></path>';
  }).join('');
  const chips = REGION_DATA.map(r=>{
    const tier = provinceTier(r.key);
    const cnt = provinceVisitedCount(r.key);
    const total = muniListFor(r.key).length;
    return '<button class="region-chip tier-'+tier+'" data-region="'+r.key+'">'+r.label+(total>1?' '+cnt+'/'+total:'')+'</button>';
  }).join('');
  return ''+
  '<div class="back-row" data-back="more">‹ 더보기</div>'+
  '<div class="section-title">'+I('pin')+'우리의 국내 여행 지도</div>'+
  '<div class="card">'+
    '<div class="map-summary"><div class="msum-num" id="mapTotalCount">'+visitedMuni+' / '+totalMuni+'</div><div class="msum-lbl">함께 다녀온 시·군·구</div></div>'+
    '<div class="map-svg-wrap"><svg viewBox="0 0 '+REGION_VIEW_W+' '+REGION_VIEW_H+'">'+paths+'</svg></div>'+
    '<div class="region-chip-grid">'+chips+'</div>'+
    '<div class="map-note">시/도를 누르면 시·군·구 단위로 자세히 표시할 수 있어요. 눌러서 표시한 다음, 아래 저장 버튼으로 한번에 저장해요.</div>'+
  '</div>';
}

function renderMapDrilldown(provinceKey){
  const region = REGION_DATA.find(r=>r.key===provinceKey);
  const muniData = MUNI_DATA[provinceKey];
  const list = muniData ? muniData.list : [];
  const visitedCount = list.filter(isMuniVisited).length;
  const paths = list.map(m=>{
    const visited = isMuniVisited(m);
    return '<path class="kr-muni '+(visited?'visited':'')+'" data-muni="'+muniKey(m)+'" d="'+m.d+'"></path>';
  }).join('');
  const chips = list.map(m=>{
    const visited = isMuniVisited(m);
    return '<button class="region-chip '+(visited?'visited':'')+'" data-muni="'+muniKey(m)+'">'+m.label+'</button>';
  }).join('');
  return ''+
  '<div class="back-row" data-mapback="overview">‹ 전체 지도</div>'+
  '<div class="section-title">'+I('pin')+(region?region.label:'')+'</div>'+
  '<div class="card">'+
    '<div class="map-summary"><div class="msum-num" id="muniCount">'+visitedCount+' / '+list.length+'</div><div class="msum-lbl">함께 다녀온 시·군·구</div></div>'+
    '<div class="map-svg-wrap"><svg viewBox="0 0 '+(muniData?muniData.viewW:600)+' '+(muniData?muniData.viewH:600)+'">'+paths+'</svg></div>'+
    '<div class="region-chip-grid">'+chips+'</div>'+
    '<div class="map-note">다녀온 곳을 눌러서 표시한 다음, 아래 저장 버튼으로 한번에 저장해요.</div>'+
  '</div>';
}

// Taps only change local state instantly (no network call) - this fixes the flaky "누르면 저장에 실패했다" issue
// since nothing is committed until the person presses the save button below.
function toggleMuniOptimistic(codesKey, provinceKey){
  const codes = codesKey.split(',');
  const wasVisited = codes.every(c=>state.travelMap[c]);
  const newVisited = !wasVisited;
  codes.forEach(c=>{
    if(newVisited) state.travelMap[c] = true; else delete state.travelMap[c];
    state.mapDirty.add(c);
  });

  document.querySelectorAll('[data-muni="'+codesKey+'"]').forEach(el=>{ el.classList.toggle('visited', newVisited); });
  const list = muniListFor(provinceKey);
  const visitedCount = list.filter(isMuniVisited).length;
  const countEl = document.getElementById('muniCount');
  if(countEl) countEl.textContent = visitedCount+' / '+list.length;
  updateMapSaveBar();
}

function attachMapHandlers(){
  document.querySelectorAll('[data-mapback]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.mapProvince = null; mountMap(); });
  });
  if(!state.mapProvince){
    document.querySelectorAll('[data-region]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const key = el.dataset.region;
        const list = muniListFor(key);
        if(list.length<=1){
          if(list.length===1) toggleMuniOptimisticOverview(muniKey(list[0]), key);
        } else {
          state.mapProvince = key;
          mountMap();
        }
      });
    });
  } else {
    document.querySelectorAll('[data-muni]').forEach(el=>{
      el.addEventListener('click', ()=>{ toggleMuniOptimistic(el.dataset.muni, state.mapProvince); });
    });
  }
}

function toggleMuniOptimisticOverview(codesKey, provinceKey){
  const codes = codesKey.split(',');
  const wasVisited = codes.every(c=>state.travelMap[c]);
  const newVisited = !wasVisited;
  codes.forEach(c=>{
    if(newVisited) state.travelMap[c] = true; else delete state.travelMap[c];
    state.mapDirty.add(c);
  });
  const tier = provinceTier(provinceKey);
  document.querySelectorAll('[data-region="'+provinceKey+'"]').forEach(el=>{
    el.classList.remove('tier-empty','tier-partial','tier-full');
    el.classList.add('tier-'+tier);
  });
  const totalMuni = Object.values(MUNI_DATA).reduce((s,p)=>s+p.list.length,0);
  const visitedMuni = Object.keys(state.travelMap).length;
  const totalEl = document.getElementById('mapTotalCount');
  if(totalEl) totalEl.textContent = visitedMuni+' / '+totalMuni;
  updateMapSaveBar();
}

function updateMapSaveBar(){
  const bar = document.getElementById('mapSaveBar');
  if(!bar) return;
  if(state.tab==='map' && state.mapDirty.size>0){
    bar.classList.remove('hide');
    bar.innerHTML = '<button id="mapSaveBtn" class="save-btn">'+I('flag','ic-16')+'변경사항 '+state.mapDirty.size+'개 저장하기</button>';
    document.getElementById('mapSaveBtn').addEventListener('click', commitMapChanges);
  } else {
    bar.classList.add('hide');
  }
}

async function commitMapChanges(){
  const btn = document.getElementById('mapSaveBtn');
  if(!btn || btn.disabled) return;
  const codes = Array.from(state.mapDirty);
  if(codes.length===0) return;
  btn.disabled = true;
  let failCount = 0;
  for(let i=0;i<codes.length;i++){
    const c = codes[i];
    btn.textContent = '저장 중... ('+(i+1)+'/'+codes.length+')';
    const visited = !!state.travelMap[c];
    const ok = visited ? await sSet('travel-map:'+c, true, true) : await sDelete('travel-map:'+c, true);
    if(ok) state.mapDirty.delete(c); else failCount++;
  }
  updateMapSaveBar();
  if(failCount===0) showToast('지도를 저장했어요');
  else showToast(failCount+'곳 저장에 실패했어요. 저장하기를 다시 눌러주세요');
}

/* =================================================================
   CULTURE
   ================================================================= */
async function loadCultureEntries(){
  const keys = await sList('culture-entry:', true);
  const results = await sGetMany(keys, true);
  const entries = results.filter(Boolean);
  entries.sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));
  state.cultureEntries = entries;
}
function typeLabel(t){ const f = CULTURE_TYPES.find(c=>c.key===t); return f ? f.label : t; }
function starsHtml(rating, interactive){
  let html = '<div class="'+(interactive?'star-row':'star-display')+'">';
  for(let i=1;i<=5;i++){
    const filled = i<=rating;
    if(interactive) html += '<button type="button" class="star-btn '+(filled?'filled':'')+'" data-star="'+i+'">'+I('star','ic-22')+'</button>';
    else html += '<span class="ic ic-14 '+(filled?'filled':'')+'">'+ICONS.star+'</span>';
  }
  return html+'</div>';
}
function resetCultureDraft(){
  state.cultureDraft = { id:null, type:'movie', title:'', date: todayStr(), rating:0, note:'', photo:null, author:null };
}

function fillCultureForm(){
  const d = state.cultureDraft;
  const editingNotice = d.id ? '<div class="cancel-edit" id="cancelEditCultureBtn">'+I('close','ic-14')+' 수정 취소하고 새로 쓰기</div>' : '';
  const photoZone = d.photoProcessing
    ? '<div class="photo-zone"><div class="upload-spinner">'+I('camera','ic-18')+'사진 처리 중...</div></div>'
    : d.photo
    ? '<div class="photo-zone"><img class="photo-preview" src="'+d.photo+'"><button class="photo-remove" id="removeCulturePhotoBtn">'+I('close','ic-14')+'</button></div>'
    : '<div class="photo-zone"><label for="culturePhotoInput">'+I('camera','ic-18')+'포스터·티켓 사진 추가</label><input type="file" accept="image/*" id="culturePhotoInput" style="display:none;"></div>';

  document.getElementById('cultureFormSection').innerHTML = ''+
    '<div class="card">'+
      editingNotice+
      '<div class="field-label">종류</div>'+
      '<div class="type-chip-row">'+CULTURE_TYPES.map(t=>'<button class="type-chip '+(d.type===t.key?'active':'')+'" data-type="'+t.key+'">'+t.label+'</button>').join('')+'</div>'+
      '<div class="field-label">제목</div>'+
      '<input type="text" class="field-input" id="cultureTitleInput" placeholder="예: 헤어질 결심, 죽고 싶지만 떡볶이는 먹고 싶어" value="'+escapeHtml(d.title)+'" maxlength="40">'+
      '<div class="field-label">날짜</div>'+
      '<input type="date" class="field-input" id="cultureDateInput" value="'+d.date+'" max="'+todayStr()+'">'+
      '<div class="field-label">별점</div>'+starsHtml(d.rating, true)+
      '<div class="field-label">사진</div>'+photoZone+
      '<div class="field-label">한줄 감상</div>'+
      '<textarea class="field-input" id="cultureNoteInput" placeholder="어땠나요?">'+escapeHtml(d.note)+'</textarea>'+
      '<button class="save-btn" id="saveCultureBtn" '+(d.photoProcessing?'disabled':'')+'>'+(d.id?'수정 완료':'기록 저장 ('+(state.currentUser||'')+')')+'</button>'+
    '</div>';

  document.querySelectorAll('#cultureFormSection .type-chip').forEach(b=>{
    b.addEventListener('click', ()=>{ state.cultureDraft.type = b.dataset.type; fillCultureForm(); });
  });
  document.getElementById('cultureTitleInput').addEventListener('input', (e)=>{ state.cultureDraft.title = e.target.value; });
  document.getElementById('cultureDateInput').addEventListener('change', (e)=>{ state.cultureDraft.date = e.target.value; });
  document.getElementById('cultureNoteInput').addEventListener('input', (e)=>{ state.cultureDraft.note = e.target.value; });
  document.querySelectorAll('#cultureFormSection .star-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const v = parseInt(b.dataset.star,10);
      state.cultureDraft.rating = (state.cultureDraft.rating===v) ? v-1 : v;
      fillCultureForm();
    });
  });
  const cPhotoInput = document.getElementById('culturePhotoInput');
  if(cPhotoInput) cPhotoInput.addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    state.cultureDraft.photoProcessing = true;
    fillCultureForm();
    compressImage(file, (dataUrl)=>{
      state.cultureDraft.photo = dataUrl;
      state.cultureDraft.photoProcessing = false;
      fillCultureForm();
    }, (err)=>{
      state.cultureDraft.photoProcessing = false;
      fillCultureForm();
      showToast('사진을 처리하지 못했어요. 다른 사진으로 시도해주세요');
    });
  });
  const removeCulturePhotoBtn = document.getElementById('removeCulturePhotoBtn');
  if(removeCulturePhotoBtn) removeCulturePhotoBtn.addEventListener('click', ()=>{ state.cultureDraft.photo=null; fillCultureForm(); });
  const cancelC = document.getElementById('cancelEditCultureBtn');
  if(cancelC) cancelC.addEventListener('click', ()=>{ resetCultureDraft(); fillCultureForm(); });

  document.getElementById('saveCultureBtn').addEventListener('click', async function(){
    const d2 = state.cultureDraft;
    if(!d2.title.trim()){ showToast('제목을 입력해주세요'); return; }
    this.disabled = true; this.textContent = '저장 중...';
    const id = d2.id || ('c'+Date.now());
    const author = d2.author || state.currentUser;
    const entry = { id, type:d2.type, title:d2.title.trim(), date:d2.date, rating:d2.rating, note:d2.note.trim(), photo:d2.photo, author, createdAt: Date.now() };
    const ok = await sSet('culture-entry:'+id, entry, true);
    if(!ok){ showToast('저장에 실패했어요'); this.disabled=false; this.textContent = d2.id?'수정 완료':'기록 저장 ('+(state.currentUser||'')+')'; return; }
    resetCultureDraft();
    await loadCultureEntries();
    fillCultureForm();
    fillCultureList();
    showToast('기록을 저장했어요');
  });
}

function fillCultureList(){
  const filtered = state.cultureFilter==='all' ? state.cultureEntries : state.cultureEntries.filter(e=>e.type===state.cultureFilter);
  const html = filtered.length===0
    ? '<div class="empty-note">아직 기록한 문화생활이 없어요.<br>같이 본 영화, 읽은 책, 다녀온 전시를 남겨보세요</div>'
    : filtered.map(e=>(
        '<div class="diary-entry">'+
          '<div class="de-top">'+
            '<div class="de-date"><span class="type-tag">'+typeLabel(e.type)+'</span> '+escapeHtml(e.title)+(e.author ? ' <span class="author-tag author-'+e.author+'">'+e.author+'</span>' : '')+'</div>'+
            '<div class="de-actions"><button data-cedit="'+e.id+'">'+I('edit','ic-16')+'</button><button data-cdel="'+e.id+'">'+I('trash','ic-16')+'</button></div>'+
          '</div>'+
          '<div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;">'+formatDateKor(e.date)+' · '+starsHtml(e.rating,false)+'</div>'+
          (e.photo ? '<img src="'+e.photo+'" loading="lazy">' : '')+
          '<div class="de-text">'+escapeHtml(e.note)+'</div>'+
        '</div>'
      )).join('');
  document.getElementById('cultureListSection').innerHTML = html;

  document.querySelectorAll('#cultureListSection [data-cedit]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const entry = state.cultureEntries.find(e=>e.id===b.dataset.cedit);
      if(!entry) return;
      state.cultureDraft = { id:entry.id, type:entry.type, title:entry.title, date:entry.date, rating:entry.rating, note:entry.note, photo:entry.photo, author:entry.author };
      fillCultureForm();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
  document.querySelectorAll('#cultureListSection [data-cdel]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.cdel;
      confirmModal('기록 삭제', '이 기록을 정말 삭제할까요?', async ()=>{
        const backup = state.cultureEntries;
        state.cultureEntries = state.cultureEntries.filter(e=>e.id!==id);
        fillCultureList();
        if(state.cultureDraft.id===id){ resetCultureDraft(); fillCultureForm(); }
        const ok = await sDelete('culture-entry:'+id, true);
        if(!ok){ state.cultureEntries = backup; fillCultureList(); showToast('삭제에 실패했어요'); return; }
        showToast('삭제했어요');
      }, '삭제');
    });
  });
}

function attachCultureFilterHandlers(){
  document.querySelectorAll('#cultureFilterRow .filter-chip').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.cultureFilter = b.dataset.cfilter;
      document.querySelectorAll('#cultureFilterRow .filter-chip').forEach(x=>x.classList.toggle('active', x===b));
      fillCultureList();
    });
  });
}

/* =================================================================
   SEASONS
   ================================================================= */
async function loadSeasonData(year){
  state.seasonData = await sGet('season-photos:'+year, true, {}) || {};
}

function renderSeason(){
  const y = state.seasonYear;
  const cards = SEASONS.map(s=>{
    const info = state.seasonData[s.key];
    const inner = info && info.photo
      ? '<img src="'+info.photo+'">' + (info.caption ? '<div class="sc-caption">'+escapeHtml(info.caption)+'</div>' : '')
      : '<div class="sc-empty">'+I('camera','ic-22')+'<span>사진 넣기</span></div>';
    return '<div class="season-card" data-season="'+s.key+'"><div class="sc-label">'+s.label+'</div>'+inner+'</div>';
  }).join('');
  return ''+
  '<div class="back-row" data-back="more">‹ 더보기</div>'+
  '<div class="section-title">'+I('season')+'사계절</div>'+
  '<div class="card">'+
    '<div class="season-year-header"><button id="prevYearBtn">‹</button><div class="sy-title">'+y+'년</div><button id="nextYearBtn">›</button></div>'+
    '<div class="season-grid">'+cards+'</div>'+
  '</div>';
}

function openSeasonModal(seasonKey){
  const s = SEASONS.find(x=>x.key===seasonKey);
  const info = state.seasonData[seasonKey] || {photo:null, caption:''};
  const photoPreview = info.photo ? '<img src="'+info.photo+'" style="width:100%;border-radius:12px;margin-bottom:12px;max-height:220px;object-fit:cover;">' : '';
  openModal(
    '<h3>'+I('season','ic-18')+state.seasonYear+'년 '+s.label+'</h3>'+
    photoPreview+
    '<label for="seasonPhotoInput" class="draw-btn" style="margin-bottom:12px;">'+I('camera','ic-16')+(info.photo?'사진 바꾸기':'사진 선택하기')+'</label>'+
    '<input type="file" accept="image/*" id="seasonPhotoInput" style="display:none;">'+
    '<input type="text" id="seasonCaptionInput" placeholder="짧은 한마디 (선택)" value="'+escapeHtml(info.caption||'')+'" maxlength="30">'+
    '<div class="modal-actions stack">'+
      '<button class="btn-primary" id="seasonSaveBtn">저장</button>'+
      (info.photo ? '<button class="btn-danger" id="seasonRemoveBtn">사진 삭제</button>' : '')+
      '<button class="btn-secondary" id="seasonCancelBtn">닫기</button>'+
    '</div>'
  );
  let pendingPhoto = info.photo || null;
  document.getElementById('seasonCancelBtn').onclick = closeModal;
  document.getElementById('seasonPhotoInput').addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const uploadLabel = document.querySelector('label[for="seasonPhotoInput"]');
    if(uploadLabel) uploadLabel.textContent = '사진 처리 중...';
    compressImage(file, (dataUrl)=>{
      pendingPhoto = dataUrl;
      closeModal();
      state.seasonData = Object.assign({}, state.seasonData, { [seasonKey]: { photo: pendingPhoto, caption: (info.caption||'') } });
      openSeasonModal(seasonKey);
    }, (err)=>{
      showToast('사진을 처리하지 못했어요. 다른 사진으로 시도해주세요');
      if(uploadLabel) uploadLabel.textContent = (info.photo?'사진 바꾸기':'사진 선택하기');
    });
  });
  document.getElementById('seasonSaveBtn').onclick = async ()=>{
    const caption = document.getElementById('seasonCaptionInput').value.trim();
    const yearData = Object.assign({}, state.seasonData);
    yearData[seasonKey] = { photo: pendingPhoto, caption };
    const ok = await sSet('season-photos:'+state.seasonYear, yearData, true);
    if(!ok){ showToast('저장에 실패했어요. 다시 시도해주세요'); return; }
    state.seasonData = yearData;
    closeModal();
    if(state.tab==='season') mountTab();
    showToast('저장했어요');
  };
  if(info.photo){
    document.getElementById('seasonRemoveBtn').onclick = async ()=>{
      const yearData = Object.assign({}, state.seasonData);
      delete yearData[seasonKey];
      const ok = await sSet('season-photos:'+state.seasonYear, yearData, true);
      if(!ok){ showToast('저장에 실패했어요'); return; }
      state.seasonData = yearData;
      closeModal();
      if(state.tab==='season') mountTab();
    };
  }
}

function attachSeasonHandlers(){
  document.getElementById('prevYearBtn').addEventListener('click', async ()=>{ state.seasonYear--; await loadSeasonData(state.seasonYear); mountTab(); });
  document.getElementById('nextYearBtn').addEventListener('click', async ()=>{ state.seasonYear++; await loadSeasonData(state.seasonYear); mountTab(); });
  document.querySelectorAll('.season-card').forEach(card=>{
    card.addEventListener('click', ()=>{ openSeasonModal(card.dataset.season); });
  });
}
